<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Custom Franchises</title>

    <link rel="stylesheet" href="css/style.light.css">
    <link rel="icon" href="image/logodiscord.png">

    <script src="https://kit.fontawesome.com/65fd17a1f9.js" crossorigin="anonymous"></script>

    <script src="javascript/index.js" defer></script>
    <script src="javascript/franchisebuilder.js" defer></script>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
}

#franchiseHome{

    max-width:1450px;

    margin:auto;

    padding:130px 40px 50px;

}

.franchise-header{
    text-align:center;
}

.franchise-header h1{
    font-size:58px;
    margin-bottom:10px;
}

.franchise-header p{
    font-size:20px;
    color:#777;
}

#createFranchiseBtn{

    margin-top:20px;

    padding:12px 30px;

    font-size:18px;

    cursor:pointer;

}

.franchise-divider{

    margin:35px 0;

}

.franchise-grid{

    display:grid;

    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));

    gap:20px;

}

.franchise-card{

    background:#fff;

    border-radius:18px;

    overflow:hidden;

    cursor:pointer;

    transition:.25s;

    box-shadow:0 10px 25px rgba(0,0,0,.18);

    border:3px solid transparent;

}

.franchise-card:hover{

    transform:translateY(-6px);

    border-color:#ff5fb8;

}

.franchise-card img{

    width:100%;

    height:220px;

    object-fit:cover;

    background:#eee;

}

.franchise-card h2{

    margin:15px 0 5px;

}

.franchise-card p{

    color:#777;

}

/* ---------- Modal ---------- */

.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;

    background:rgba(0,0,0,.65);

    justify-content:center;
    align-items:center;

    z-index:9999;
}

.modal-content{

    background:white;

    width:1200px;

    max-width:95vw;

    max-height:90vh;

    overflow-y:auto;

    border-radius:20px;

    padding:30px;

}

.modal input,
.modal textarea{

    width:100%;

    padding:10px;

    margin-top:5px;

    margin-bottom:18px;

    box-sizing:border-box;

}

.modal-buttons{

    display:flex;

    justify-content:flex-end;

    gap:10px;

}
.modal-content h2{

    margin-top:0;

    text-align:center;

}

.modal label{

    font-weight:bold;

}

.modal-buttons{

    margin-top:20px;

}
#franchisePage{

    max-width:1400px;

    margin:auto;

    padding:40px;

}

#franchiseInfo{

    display:flex;

    align-items:center;

    gap:30px;

}

#franchiseLogo{

    width:150px;

    height:150px;

    object-fit:cover;

    border-radius:20px;

}

#franchiseActions{

    margin-top:25px;

    display:flex;

    gap:15px;

}

#seasonGrid{

    display:grid;

    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));

    gap:20px;

    margin-top:40px;

}

#createSeasonBtn{

    margin-top:30px;

    padding:15px 35px;

    font-size:18px;

}
.season-layout{

    display:grid;

    grid-template-columns:2fr 1fr;

    gap:30px;

}

#queenSearch{

    width:100%;

    padding:12px;

    font-size:17px;

}

#queenResults{

    max-height:250px;

    overflow-y:auto;

    margin-top:10px;

    border:1px solid #ddd;

    border-radius:10px;

}

.queenResult{

    display:flex;

    align-items:center;

    gap:12px;

    padding:10px;

    cursor:pointer;

}

.queenResult:hover{

    background:#ffe3f3;

}

.queenResult img{

    width:55px;

    height:55px;

    object-fit:cover;

    border-radius:50%;

}

#selectedQueens{

    display:flex;

    flex-wrap:wrap;

    gap:10px;

    margin-top:15px;

}

.selectedQueen{

    position:relative;

}

.selectedQueen img{

    width:75px;

    height:75px;

    border-radius:10px;

    object-fit:cover;

}

.selectedQueen{

    width:110px;

    text-align:center;

    position:relative;

}

.selectedQueen img{

    width:100px;

    height:100px;

    border-radius:12px;

    object-fit:cover;

    border:3px solid #ff66b5;

}

.selectedQueenName{

    margin-top:6px;

    font-size:14px;

    font-weight:bold;

}

.removeQueenBtn{

    position:absolute;

    top:-8px;

    right:-8px;

    width:24px;

    height:24px;

    border:none;

    border-radius:50%;

    background:#ff2b57;

    color:white;

    cursor:pointer;

    font-weight:bold;

}

.seasonCard{

    background:white;

    border-radius:18px;

    overflow:hidden;

    cursor:pointer;

    transition:.25s;

    box-shadow:0 10px 25px rgba(0,0,0,.15);

}

.seasonCard:hover{

    transform:translateY(-8px);

    box-shadow:0 18px 35px rgba(0,0,0,.22);

}

.seasonBanner{

    height:170px;

    background:#ddd;

    overflow:hidden;

}

.seasonBanner img{

    width:100%;

    height:100%;

    object-fit:cover;

}

.seasonInfo{

    padding:18px;

}

.seasonInfo h2{

    margin:0;

}

.seasonInfo p{

    margin-top:8px;

    color:#888;

}
.seasonBanner{

    width:100%;

    height:170px;

    overflow:hidden;

    background:#ececec;

}

.seasonBanner img{

    width:100%;

    height:100%;

    object-fit:cover;

    transition:.35s;

}

.seasonCard:hover .seasonBanner img{

    transform:scale(1.08);

}

.seasonPlaceholder{

    display:flex;

    justify-content:center;

    align-items:center;

    height:100%;

    font-size:55px;

    color:#bbb;

}
.seasonBody{

    padding:18px;

}

.seasonBody h2{

    margin:0;

    font-size:24px;

}

.seasonBody p{

    margin:8px 0;

    color:#ff3b9d;

    font-weight:bold;

}

.seasonBody small{

    color:#777;

    display:block;

    margin-top:8px;

    line-height:1.4;

}

</style>

</head>

<body>
<header id="header" class="header">
    <div class="container-fluid container-xl d-flex align-items-center justify-content-between">

        <a href="index.html" class="logo d-flex align-items-center">
            <img src="image/logodiscord.png">
            <h1>Esoteric Simulator</h1>
        </a>

        <nav id="navbar" class="navbar">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="predef.html">Predefined Casts</a></li>
                <li><a href="custom.html">Custom</a></li>
                <li><a href="franchisebuilder.html" class="active">Franchise Builder</a></li>
            </ul>
        </nav>

    </div>
</header>
<main id="franchiseHome">

<div class="franchise-header">

<h1>CUSTOM FRANCHISES</h1>

<p>
Create and save your own fantasy franchises!
</p>

<button id="createFranchiseBtn">

<i class="fa-solid fa-plus"></i>

Create Franchise

</button>

</div>

<hr class="franchise-divider">

<div id="franchiseGrid" class="franchise-grid">

    <div id="emptyState">

        <i class="fa-solid fa-clapperboard"></i>

        <h2>No Custom Franchises Yet</h2>

        <p>
            Click <b>Create Franchise</b> to start building your own Drag Race universe.
        </p>

    </div>

</div>

</main>

<main id="franchisePage" style="display:none;">

    <button id="backHomeBtn">
        ← Back
    </button>

    <div id="franchiseInfo">

        <img id="franchiseLogo" src="">

        <div>

            <h1 id="franchiseTitle"></h1>

            <p id="franchiseDesc"></p>

        </div>

    </div>

    <div id="franchiseActions">

        <button id="editFranchiseBtn">
            Edit Franchise
        </button>

        <button id="deleteFranchiseBtn">
            Delete Franchise
        </button>

    </div>

    <hr>

    <div id="seasonGrid">

    </div>

    <button id="createSeasonBtn">

        + Create Season

    </button>

<div id="seasonModal" class="modal">

    <div class="modal-content">

        <h2>Create Season</h2>

        <label>Season Name</label>

        <input
            type="text"
            id="seasonNameInput"
            placeholder="Season 1"
        >

        <label>Banner (Optional)</label>

        <input
            type="file"
            id="seasonBannerInput"
            accept="image/*"
        >

        <label>Poster Card (Optional)</label>

        <input
            type="file"
            id="seasonPosterInput"
            accept="image/*"
        >

        <label>Description</label>

        <textarea
            id="seasonDescriptionInput"
            rows="4"
        ></textarea>

<label>Cast</label>

<input
    type="text"
    id="queenSearch"
    placeholder="Search queens..."
>

<div id="queenResults"></div>

<h3 id="seasonCastCount">

0 Queens Selected

</h3>

<div id="selectedQueens"></div>

        <label>Season Format</label>

        <select id="seasonFormatSelect"></select>

        <label>Finale Format</label>

        <select id="seasonFinaleSelect"></select>

        <label>Returning Format</label>

        <select id="seasonReturningSelect"></select>

<div class="modal-buttons">

<button id="deleteSeasonBtn" style="display:none;">
    Delete
</button>

<button id="duplicateSeasonBtn" style="display:none;">
    Duplicate
</button>

    <button id="cancelSeasonBtn">
        Cancel
    </button>

    <button id="saveSeasonBtn">
        Save Season
    </button>

</div>


</div>

</main>

<!-- Create Franchise Modal -->

<div id="createFranchiseModal" class="modal">

<div class="modal-content">

<h2>Create Franchise</h2>

<label>Franchise Name</label>

<input
type="text"
id="franchiseNameInput"
placeholder="Drag Race Fantasia"
>

<label>Logo (Optional)</label>

<input
type="file"
id="franchiseLogoInput"
accept="image/*"
>
<center>

<img
id="logoPreview"
src="image/empty.png"
style="display:none;width:180px;margin-bottom:15px;border-radius:10px;">

</center>

<label>Description (Optional)</label>

<textarea
id="franchiseDescriptionInput"
rows="4"
placeholder="Write something..."
></textarea>

<div class="modal-buttons">

<button id="cancelFranchiseBtn">

Cancel

</button>

<button id="saveFranchiseBtn">

Create

</button>

</div>

</div>

</div>
<div id="popupContainer"></div>
</body>

</html>
